name: Dev Container Rebuild Test

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.devcontainer/**'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.devcontainer/**'
      - 'Dockerfile'
  schedule:
    - cron: '0 0 * * 0' # 每週執行一次

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Dev Container
        run: |
          docker build -t devcontainer-test -f .devcontainer/Dockerfile .

      - name: Test dependencies installation
        run: |
          docker run --rm devcontainer-test bash -c "pip install -r requirements.txt"
