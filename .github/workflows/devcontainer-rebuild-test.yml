name: Dev Container Rebuild Test

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.devcontainer/**'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.devcontainer/**'
      - 'Dockerfile'
  schedule:
    - cron: '0 0 * * 0' # 每週執行一次

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Dev Container
        run: |
          docker build -t devcontainer-test -f .devcontainer/Dockerfile .

      - name: Verify uv.lock present
        run: |
          test -f uv.lock

      - name: Test dependencies installation (match devcontainer postCreate)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/Ivyhousetw-META" \
            -w "/workspaces/Ivyhousetw-META" \
            devcontainer-test \
            bash -lc "set -euo pipefail; uv --version; uv sync --frozen"
