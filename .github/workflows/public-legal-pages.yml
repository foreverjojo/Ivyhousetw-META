name: Public Legal Pages

on:
  push:
    branches:
      - main
      - chore/cloudbuild-cloudrun
    paths:
      - .github/workflows/public-legal-pages.yml
      - public_site/**
      - doc/OAUTH_CONSENT_PUBLICATION.md
      - DEPLOY.md
      - readme.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-legal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
