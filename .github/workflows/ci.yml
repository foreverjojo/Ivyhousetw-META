name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Verify skill schemas
        run: |
          python tests/verify_skill_schemas.py

      - name: Lint with Ruff
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --target-version=py311

      - name: Lint with Ruff (style-only, non-blocking)
        run: |
          # Check all files for style issues (warning only)
          ruff check core utils scripts tests main.py --target-version=py311
        continue-on-error: true

      - name: Format check with Ruff
        run: |
          ruff format --check core utils scripts tests main.py
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing
        continue-on-error: true  # 初期允許測試失敗，待補齊測試後移除

      - name: Check for hardcoded secrets (basic)
        run: |
          # 簡易檢查：搜尋常見的 API key patterns，只掃描原始碼目錄並排除 vendor/metadata 等目錄以減少 false positives
          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.opencode --exclude-dir=.python311 --exclude-dir=.pytest_cache --exclude-dir=.venv --exclude-dir=.github --exclude-dir=.agent"
          SEARCH_TARGETS="core utils scripts tests main.py app.py"
          # 1) 找 sk- 型式 (長度 >= 20)
          ! grep -R $EXCLUDES -E "sk-[A-Za-z0-9]{20,}" --include="*.py" $SEARCH_TARGETS || (echo "Found potential API key!" && exit 1)
          # 2) 找像 api_key = "..." 的明文賦值
          ! grep -R $EXCLUDES -E "api[_-]?key[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" --include="*.py" $SEARCH_TARGETS || (echo "Found hardcoded API key!" && exit 1)

  # P1: 依賴項安全掃描
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for vulnerabilities
        run: |
          # 檢查 requirements.txt 中的已知漏洞
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --output json > safety-report.json || true
            # 顯示摘要
            echo "=== Security Scan Results ==="
            cat safety-report.json | python -c "import sys,json; d=json.load(sys.stdin); print(f'Found {len(d.get(\"vulnerabilities\", []))} vulnerabilities')"
          fi
        continue-on-error: true  # 初期只警告，不阻擋

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: safety-report.json
          retention-days: 30

  pr-gate:
    name: PR Gate Check
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'pull_request'

    steps:
      - name: Check CI status
        run: |
          echo "✅ All quality checks passed! PR is ready for review."
