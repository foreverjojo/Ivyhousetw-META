name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with Ruff
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --target-version=py311
          # Check all files for style issues (warning only)
          ruff check . --target-version=py311
      
      - name: Format check with Ruff
        run: |
          ruff format --check .
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing
        continue-on-error: true  # 初期允許測試失敗，待補齊測試後移除
      
      - name: Check for hardcoded secrets (basic)
        run: |
          # 簡易檢查：搜尋常見的 API key patterns
          ! grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . || (echo "Found potential API key!" && exit 1)
          ! grep -r "api[_-]key\s*=\s*['\"][^'\"]\+['\"]" --include="*.py" . || (echo "Found hardcoded API key!" && exit 1)

  pr-gate:
    name: PR Gate Check
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check CI status
        run: |
          echo "✅ All quality checks passed! PR is ready for review."
