name: Build & Publish Dev Container Image (GHCR)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        id: buildpush
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer:devcontainer-${{ github.sha }}
            ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer:devcontainer-main
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write digest artifact
        run: |
          echo "image=ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer:devcontainer-${GITHUB_SHA}" > devcontainer_image.txt
          echo "digest=${{ steps.buildpush.outputs.digest }}" >> devcontainer_image.txt
          echo "pinned=ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer@${{ steps.buildpush.outputs.digest }}" >> devcontainer_image.txt
          cat devcontainer_image.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer-image
          path: devcontainer_image.txt

      - name: Summary
        run: |
          echo "## Dev Container Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag (commit): \`ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer:devcontainer-${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.buildpush.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Pinned: \`ghcr.io/foreverjojo/ivyhousetw-meta-devcontainer@${{ steps.buildpush.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

