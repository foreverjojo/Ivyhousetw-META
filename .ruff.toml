# Ruff 配置檔案
# 參考：https://docs.astral.sh/ruff/configuration/

[lint]
# 啟用的規則集
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

# 忽略的規則
ignore = [
    "E501",  # line too long (已有 formatter 處理)
    "B008",  # do not perform function calls in argument defaults (常見於 FastAPI/Streamlit)
]

# 每行最大長度
line-length = 100

# 排除的目錄
exclude = [
    ".git",
    ".venv",
    ".python311",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[lint.per-file-ignores]
# 允許 __init__.py 中的未使用 import
"__init__.py" = ["F401"]

[format]
# 引號風格
quote-style = "double"

# 縮排風格
indent-style = "space"

# 行尾處理
line-ending = "auto"
